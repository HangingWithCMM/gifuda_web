<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Gifuda</title>
<link rel="icon" type="image/png" href="gifuda_fav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --bg-deepest: #0E0B16;
  --bg-panel: #1E1929;
  --border-soft: #221D30;
  --text-primary: #F5EFF7;
  --text-secondary: #B8B0CC;
  --text-muted: #7A7290;
  --sakura: #FFB7C5;
  --sakura-deep: #E879A5;
  --lavender: #C8B6E2;
  --lavender-deep: #9F86C0;
  --font-display: 'Zen Maru Gothic', sans-serif;
  --font-body: 'Nunito', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
html, body {
  height: 100%;
  width: 100%;
  overflow: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
html::-webkit-scrollbar, body::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}
body {
  font-family: var(--font-body);
  background-color: var(--bg-deepest);
  color: var(--text-primary);
  line-height: 1.6;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  text-align: center;
  padding: 24px;
  position: relative;
}
.orb-wrap {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}
.hero-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
}
.orb-1 {
  width: 380px; height: 380px;
  background: rgba(255, 183, 197, 0.16);
  top: -100px; left: -100px;
  animation: orb-drift 14s ease-in-out infinite;
}
.orb-2 {
  width: 320px; height: 320px;
  background: rgba(159, 134, 192, 0.18);
  bottom: -100px; right: -80px;
  animation: orb-drift-reverse 17s ease-in-out infinite;
}
@media (max-width: 480px) {
  .orb-1 { width: 240px; height: 240px; }
  .orb-2 { width: 200px; height: 200px; }
}
@keyframes orb-drift {
  0%, 100% { transform: translate(0, 0); opacity: 0.85; }
  50% { transform: translate(50px, 40px); opacity: 1; }
}
@keyframes orb-drift-reverse {
  0%, 100% { transform: translate(0, 0); opacity: 0.8; }
  50% { transform: translate(-40px, -50px); opacity: 1; }
}
.content {
  position: relative;
  z-index: 2;
  max-width: 480px;
}
.icon {
  width: 256px; height: 256px;
  border-radius: 20px;
  margin-bottom: 24px;
  animation: bob 3s ease-in-out infinite;
  filter: drop-shadow(0 0 24px rgba(255, 183, 197, 0.4));
}
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.code {
  font-family: var(--font-display);
  font-size: clamp(64px, 12vw, 100px);
  font-weight: 800;
  letter-spacing: -3px;
  background: linear-gradient(120deg, var(--sakura) 0%, var(--lavender) 45%, var(--sakura-deep) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  line-height: 1;
}
.subtitle-jp {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--lavender);
  margin: 8px 0 4px;
}
h1 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}
p {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: 32px;
}
.wink {
  color: var(--lavender);
  font-style: italic;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  text-decoration: none;
  transition: all 0.2s;
  background: var(--sakura-deep);
  color: white;
}
.btn:hover {
  background: var(--sakura);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(232, 121, 165, 0.3);
}
</style>
</head>
<body>
<div class="orb-wrap" aria-hidden="true">
  <div class="hero-orb orb-1"></div>
  <div class="hero-orb orb-2"></div>
</div>
<div class="content">
  <img src="gifuda_icon.png" class="icon" alt="Gifuda icon">
  <div class="code">404</div>
  <div class="subtitle-jp">見つかりません</div>
  <h1>This page wandered off your desktop.</h1>
  <p>Whatever you were looking for isn't here. <span class="wink">Maybe it's hiding behind a pet.</span></p>
  <a href="https://gifuda.nya.pub" class="btn">Back to Home</a>
</div>
</body>
</html>
